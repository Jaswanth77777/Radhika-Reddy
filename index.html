<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Joy CampusCare</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: login gate -> app shell with role sidebar (bottom bar on phones) + module pages in a 12-col grid */
:root{--onb:#fff;--bg:#f3f6f5;--panel:#fff;--ink:#10262b;--mute:#5b7076;--line:#dbe5e3;--brand:#0b6b6f;--brand-2:#e3f2f0;--sos:#d92f2f;--sos-2:#fde8e8;--ok:#1f8a4c;--ok-2:#e0f4e8;--warn:#b7791f;--warn-2:#fdf3dc;--night:#1d2a5c;--night-2:#e6e9f7;
--d:'Bricolage Grotesque',system-ui,sans-serif;--b:'Figtree',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--onb:#06201f;--bg:#0c1a1d;--panel:#142428;--ink:#e6f1ef;--mute:#92a9ad;--line:#26393d;--brand:#4fc3c0;--brand-2:#173a3b;--sos:#ff6b6b;--sos-2:#3a1a1c;--ok:#4cc582;--ok-2:#163326;--warn:#e8b04b;--warn-2:#3a2f14;--night:#9fb0f5;--night-2:#1c2347;color-scheme:dark}}
:root[data-theme="dark"]{--onb:#06201f;--bg:#0c1a1d;--panel:#142428;--ink:#e6f1ef;--mute:#92a9ad;--line:#26393d;--brand:#4fc3c0;--brand-2:#173a3b;--sos:#ff6b6b;--sos-2:#3a1a1c;--ok:#4cc582;--ok-2:#163326;--warn:#e8b04b;--warn-2:#3a2f14;--night:#9fb0f5;--night-2:#1c2347;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--b);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--d);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.6rem}h3{font-size:1.05rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn{background:var(--brand);color:var(--onb);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.sos{background:var(--sos);color:#fff}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mute);margin:10px 0 4px;letter-spacing:.03em;text-transform:uppercase}
.gate{max-width:980px;margin:0 auto;padding-block:48px}
.gate h1{font-size:clamp(2rem,5vw,3.2rem);max-width:15ch}
.gate p.lead{color:var(--mute);max-width:52ch;margin:12px 0 28px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.role{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:18px;text-align:left}
.role:hover{border-color:var(--brand)}
.role b{font-family:var(--d);font-size:1.15rem;display:block}
.role span{color:var(--mute);font-size:.88rem}
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh;max-width:1280px;margin:0 auto;gap:24px}
.side{position:sticky;top:0;align-self:start;padding-block:20px;display:flex;flex-direction:column;gap:4px;max-height:100vh;overflow:auto}
.brand{font-family:var(--d);font-weight:800;font-size:1.25rem;color:var(--brand);margin-bottom:10px}
.brand small{display:block;font:500 .72rem var(--b);color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.nav{background:none;border:0;text-align:left;padding:8px 10px;border-radius:8px;color:var(--mute);font-weight:500}
.nav:hover{background:var(--brand-2)}
.nav.on{background:var(--brand-2);color:var(--brand);font-weight:600}
.nav.night.on{background:var(--night-2);color:var(--night)}
.main{padding-block:20px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top .who{color:var(--mute);font-size:.9rem}
.sosbar{position:sticky;top:0;z-index:5;background:var(--sos);color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap}
.sosbar button{background:#fff;color:var(--sos);border:0;border-radius:8px;padding:6px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h3{margin-bottom:6px}
.muted{color:var(--mute);font-size:.9rem}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--brand-2);color:var(--brand)}
.pill.ok{background:var(--ok-2);color:var(--ok)}.pill.warn{background:var(--warn-2);color:var(--warn)}.pill.bad{background:var(--sos-2);color:var(--sos)}.pill.night{background:var(--night-2);color:var(--night)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.item>div{min-width:0}
.stat{font-family:var(--d);font-size:2rem;font-weight:800;color:var(--brand)}
.tokenbox{background:var(--brand);color:var(--onb);border-radius:12px;padding:16px;text-align:center}
.tokenbox .n{font-family:var(--d);font-size:3rem;font-weight:800;line-height:1}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;font-size:.88rem}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--onb)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:168px;aspect-ratio:1;background:#fff;padding:8px;border-radius:8px;gap:0}
.qr i{background:#fff}.qr i.k{background:#10262b}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:50;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(5,20,22,.6);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{max-width:440px;width:100%}
.barv{display:flex;align-items:flex-end;gap:8px;height:130px}
.barv div{flex:1;background:var(--brand);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.barv span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--mute)}
.pulse{animation:p 1.4s infinite}@keyframes p{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
@media (max-width:760px){
 .shell{grid-template-columns:minmax(0,1fr);gap:0}
 .side{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-block:10px;gap:6px;border-bottom:1px solid var(--line)}
 .brand{display:none}.nav{white-space:nowrap}
}
</style>

}
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()})();

<script>
const ROLES={student:{t:'Student',d:'Book doctors, track your token, get emergency help.',id:'JU21CS0417',pw:'student123'},doctor:{t:'Doctor',d:'Run your queue, write prescriptions, schedule follow-ups.',id:'anitha@joyuni.edu',pw:'doctor123'},admin:{t:'Admin',d:'Manage people, queues, emergencies and partner hospitals.',id:'admin@joyuni.edu',pw:'admin123'},hospital:{t:'Hospital',d:'Keep beds, doctors, equipment and ambulances up to date.',id:'sunrise@hosp.in',pw:'hospital123'}};
const NAV={
 student:[['home','Dashboard'],['book','Book appointment'],['appts','My appointments'],['hist','History & prescriptions'],['night','NightCare','night'],['sos','One-tap SOS'],['near','Nearby hospitals'],['match','Emergency matching'],['diag','Diagnostics & referrals'],['labs','Lab tests'],['meds','Medicine reminders'],['qr','Emergency QR card'],['blood','Blood finder'],['opinion','Second opinion'],['access','Accessibility help'],['privacy','Data privacy']],
 doctor:[['dhome','Today\'s queue'],['davail','Availability'],['dpat','Patient records'],['dop','Second opinions']],
 admin:[['ahome','Overview'],['astu','Students'],['adoc','Doctors'],['aq','Appointments & queue'],['aem','Emergency requests'],['ahos','Hospital partners'],['afb','Feedback'],['aan','Analytics']],
 hospital:[['hhome','Facilities & beds'],['hdoc','Doctor duty'],['heq','Equipment & maintenance'],['hinfo','Profile & verification']]};
function render(){
 if(!U){$('#app').innerHTML=gate();return}
 const nav=NAV[U.role].map(n=>`<button class="nav ${n[2]||''} ${view===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
 const nm=U.role==='student'?me().name:U.role==='doctor'?D(U.id).name:U.role==='hospital'?H(U.id).name:'Administrator';
 const sos=U.role==='student'&&view!=='sos'?`<div class="sosbar"><b>Emergency? Get help now.</b><button onclick="go('sos')">Open SOS</button></div>`:'';
 $('#app').innerHTML=`<div class="shell"><aside class="side"><div class="brand">Joy CampusCare<small>${ROLES[U.role].t} portal</small></div>${nav}<button class="nav" onclick="logout()">Log out</button></aside><main class="main"><div class="top"><div><span class="who">Signed in as</span> <b>${esc(nm)}</b></div><button class="btn ghost sm" onclick="toggleTheme()">Light / dark</button></div>${sos}<div id="page"></div></main></div>`;
 const f=VIEWS[view]||VIEWS[NAV[U.role][0][0]];$('#page').innerHTML=f();
 if(view==='qr')drawQR();
 window.scrollTo(0,0);
}
function toggleTheme(){const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'}
function logout(){U=null;tmp={};render()}
function gate(){
 const m=tmp.gate;
 if(!m)return `<div class="gate"><h1>Joy University healthcare, in one place.</h1><p class="lead">Appointments, night-time help, emergency SOS, hospital matching and medical records for students, doctors, admins and partner hospitals. Pick your role to sign in.</p><div class="roles">${Object.entries(ROLES).map(([k,r])=>`<button class="role" onclick="tmp.gate='${k}';render()"><b>${r.t} login</b><span>${r.d}</span></button>`).join('')}</div><div class="row" style="margin-top:22px"><button class="btn sos" onclick="emergencyNoLogin()">Emergency help, no login needed</button><span class="muted">Demo build: data stays in this browser.</span></div></div>`;
 const r=ROLES[m];
 return `<div class="gate"><button class="btn ghost sm" onclick="tmp.gate=null;render()">Back</button><h1 style="margin-top:14px">${r.t} login</h1><div class="card" style="max-width:420px;margin-top:16px"><label for="lid">${m==='student'?'Roll number':'Email'}</label><input id="lid" value="${r.id}"><label for="lpw">Password</label><input id="lpw" type="password" value="${r.pw}"><p class="muted">Demo credentials are filled in for you.</p><div class="row"><button class="btn" onclick="login('${m}')">Sign in</button>${m==='student'?`<button class="btn ghost" onclick="regStudent()">New student? Register</button>`:''}${m==='hospital'?`<button class="btn ghost" onclick="regHospital()">Register hospital</button>`:''}</div></div></div>`;
}
function login(role){
 const i=val('lid'),p=val('lpw');let u=null;
 if(role==='student'){const s=S.students.find(s=>s.id.toLowerCase()===i.toLowerCase()&&s.pw===p);if(s&&!s.active)return toast('This account is suspended. Contact admin.');if(s)u={role,id:s.id}}
 if(role==='doctor'){const d=S.doctors.find(d=>d.email===i&&d.pw===p&&d.active);if(d)u={role,id:d.id}}
 if(role==='admin'&&i===S.admin.email&&p===S.admin.pw)u={role};
 if(role==='hospital'){const h=S.hospitals.find(h=>h.email===i&&h.pw===p);if(h)u={role,id:h.id}}
 if(!u)return toast('Wrong ID or password.');
 U=u;view=NAV[role][0][0];render();
}

 <div class="list">${cs.map(h=>{const up=h.maint.includes(t);return `<div class="card"><div class="row sp"><div><h3>${esc(h.name)}</h3><div class="muted">${h.km} km · ${esc(h.hrs)} · ${esc(h.ph)}</div></div><div style="text-align:right"><div class="stat" style="font-size:1.4rem">${h.cost[t]?'₹'+h.cost[t]:'Ask centre'}</div><span class="pill ${up?'warn':'ok'}">${up?'Under maintenance':'Available'}</span></div></div><div class="row" style="margin-top:8px"><button class="btn sm" ${up?'disabled':''} onclick="bookDiag('${h.id}','${t}')">Book test</button>${up&&okc[0]?`<span class="muted">Alternative: ${esc(okc[0].name)} (${okc[0].km} km)</span>`:''}</div></div>`}).join('')||`<p class="muted">No centre offers ${t} yet.</p>`}</div>
 <h3 style="margin:22px 0 8px">My diagnostic bookings and reports</h3><div class="list">${mb.length?mb.map(d=>`<div class="card"><div class="row sp"><div><b>${d.test}</b> at ${esc(H(d.hid).name)}<div class="muted">${d.date}${d.transport?' · Transport assistance requested':''}</div></div><span class="pill ${d.step===2?'ok':''}">${['Booked','Test done','Report stored'][d.step]}</span></div><div class="row" style="margin-top:8px">${d.step<2?`<button class="btn ghost sm" onclick="advDiag(${d.id})">Demo: advance status</button>`:`<span class="muted">${esc(d.report)}</span><button class="btn sm" onclick="tmp.doc='d1';bookFollow()">Book follow-up consultation</button>`}</div></div>`).join(''):'<p class="muted">No bookings yet.</p>'}</div>`};
function bookDiag(hid,t){modal(`<h3>Book ${t}</h3><p class="muted">${esc(H(hid).name)}</p><label for="dd">Date</label><select id="dd">${[0,1,2,3].map(addDays).map(d=>`<option>${d}</option>`).join('')}</select><label style="text-transform:none;display:flex;gap:8px;align-items:center"><input id="dt" type="checkbox" style="width:auto">I need transport assistance</label><div class="row" style="margin-top:14px"><button class="btn" onclick="doDiag('${hid}','${t}')">Confirm</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
function doDiag(hid,t){S.diag.push({id:id(),sid:U.id,hid,test:t,date:val('dd'),transport:$('#dt').checked,step:0,report:''});S.refs.forEach(r=>{if(r.test.includes(t.split(' ')[0]))r.booked=true});closeModal();rerender();toast(t+' booked.')}
function advDiag(i){const d=S.diag.find(x=>x.id===i);d.step++;if(d.step===2)d.report=d.test+' report stored on '+today()+'. Normal findings (sample).';rerender()}
const LABT={'Complete blood count':350,'Blood sugar (fasting)':120,'Lipid profile':600,'Thyroid profile':550,'Vitamin D':900};
const LSTEP=['Booked','Sample collected','Processing','Report ready'];
VIEWS.labs=()=>`<h2>Lab test tracking</h2><div class="grid" style="margin-top:12px"><div class="card"><h3>Book a blood test</h3><label for="lt">Test</label><select id="lt">${Object.keys(LABT).map(k=>`<option>${k} (₹${LABT[k]})</option>`).join('')}</select><label for="lc">Lab</label><select id="lc">${vh().map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select><label for="ld">Date</label><select id="ld">${[0,1,2].map(addDays).map(d=>`<option>${d}</option>`).join('')}</select><button class="btn" style="margin-top:12px" onclick="bookLab()">Book</button></div></div><h3 style="margin:20px 0 8px">Test history</h3><div class="list">${S.labs.map(l=>`<div class="card"><div class="row sp"><div><b>${esc(l.test)}</b> · ₹${l.cost}<div class="muted">${l.date} · ${esc(l.centre)}</div></div><span class="pill ${l.step===3?'ok':''}">${LSTEP[l.step]}</span></div><div class="row" style="margin:8px 0">${LSTEP.map((t,i)=>`<span class="pill ${i<=l.step?'ok':''}" style="${i>l.step?'opacity:.5':''}">${t}</span>`).join('')}</div>${l.step<3?`<button class="btn ghost sm" onclick="advLab(${l.id})">Demo: advance status</button>`:'<span class="muted">Report available in your records.</span>'}</div>`).join('')}</div>`;
function bookLab(){const raw=val('lt');const k=raw.replace(/ \(₹\d+\)$/,'');S.labs.unshift({id:id(),test:k,date:val('ld'),step:0,cost:LABT[k],centre:H(val('lc')).name});rerender();toast('Lab test booked.')}
function advLab(i){S.labs.find(l=>l.id===i).step++;rerender()}
</script>
<script>
VIEWS.meds=()=>`<h2>Medicine reminders</h2><div class="grid" style="margin-top:12px"><div class="card"><h3>Add medicine</h3><label for="mn">Name and dose</label><input id="mn" placeholder="Cetirizine 10 mg"><label for="mt">Times (comma separated)</label><input id="mt" value="09:00, 21:00"><label for="md">Days</label><input id="md" type="number" value="5" min="1"><button class="btn" style="margin-top:12px" onclick="addMed()">Add reminder</button></div></div><h3 style="margin:20px 0 8px">Schedule</h3><div class="list">${S.meds.map(m=>`<div class="card"><div class="row sp"><div><b>${esc(m.name)}</b><div class="muted">${m.days} days</div></div><button class="btn ghost sm" onclick="S.meds=S.meds.filter(x=>x.id!==${m.id});rerender()">Remove</button></div><div class="row" style="margin-top:8px">${m.times.map(t=>{const k=today()+t;return `<button class="chip ${m.taken[k]?'on':''}" onclick="takeMed(${m.id},'${k}')">${t} ${m.taken[k]?'Taken':'Mark taken'}</button>`}).join('')}</div></div>`).join('')||'<p class="muted">No medicines yet.</p>'}</div><div class="card" style="margin-top:14px"><h3>Follow-up notifications</h3>${mine().filter(a=>a.status==='waiting'&&a.fu).map(a=>`<div class="item">Follow-up with ${esc(D(a.did).name)} on ${a.date}</div>`).join('')||'<p class="muted">No follow-ups scheduled.</p>'}</div>`;
function addMed(){const n=val('mn');if(!n)return toast('Enter a medicine name.');S.meds.push({id:id(),name:n,times:val('mt').split(',').map(x=>x.trim()).filter(Boolean),days:+val('md')||1,taken:{}});rerender()}
function takeMed(i,k){const m=S.meds.find(x=>x.id===i);m.taken[k]=!m.taken[k];rerender()}
VIEWS.qr=()=>{const s=me();return `<h2>Emergency QR health card</h2><div class="grid" style="margin-top:12px"><div class="card" style="text-align:center"><div id="qrbox" style="display:inline-block;background:#fff;padding:10px;border-radius:8px"></div><p class="muted" style="margin:8px 0 0">${esc(s.id)}</p></div><div class="card"><h3>${esc(s.name)}</h3><div class="item"><span class="muted">Blood group</span><b>${esc(s.blood)}</b></div><div class="item"><span class="muted">Allergies</span><b>${esc(s.allergy)}</b></div><div class="item"><span class="muted">Conditions</span><b>${esc(s.cond)}</b></div><div class="item"><span class="muted">Emergency contact</span><b>${esc(s.ec)}</b></div><button class="btn ghost sm" style="margin-top:10px" onclick="editMed()">Edit details</button></div></div><div class="card" style="margin-top:14px"><h3>Authorised staff access</h3><p class="muted">Only logged-in medical staff see the full card. Each scan is added to your access history.</p><button class="btn" onclick="staffScan()">Simulate a staff scan</button></div>`};
function drawQR(){const b=$('#qrbox');if(!b)return;b.innerHTML='';try{new QRCode(b,{text:'JOYU-HEALTH:'+U.id,width:150,height:150})}catch(e){b.textContent='QR library could not load.'}}
function staffScan(){log('Dr. Anitha Rao','Scanned emergency QR card');rerender();toast('Scan recorded in access history.')}
function editMed(){const s=me();modal(`<h3>Emergency details</h3><label for="e1">Blood group</label><input id="e1" value="${esc(s.blood)}"><label for="e2">Allergies</label><input id="e2" value="${esc(s.allergy)}"><label for="e3">Conditions</label><input id="e3" value="${esc(s.cond)}"><label for="e4">Emergency contact</label><input id="e4" value="${esc(s.ec)}"><div class="row" style="margin-top:14px"><button class="btn" onclick="const s=me();s.blood=val('e1');s.allergy=val('e2');s.cond=val('e3');s.ec=val('e4');closeModal();rerender()">Save</button></div>`)}
VIEWS.blood=()=>{const g=tmp.g||'B+';const l=S.blood.filter(b=>b.u[g]>0).sort((a,b)=>a.km-b.km);
 return `<h2>Blood availability finder</h2><div class="tabs">${['A+','A-','B+','B-','O+','O-','AB+','AB-'].map(x=>`<button class="chip ${g===x?'on':''}" onclick="tmp.g='${x}';render()">${x}</button>`).join('')}</div><div class="list">${l.map(b=>`<div class="card"><div class="row sp"><div><h3>${b.bank}</h3><div class="muted">${b.km} km · Updated ${b.upd}</div></div><div style="text-align:right"><div class="stat">${b.u[g]}</div><div class="muted">units of ${g}</div></div></div>${b.ver?'<span class="pill ok">Verified</span>':''}</div>`).join('')||`<p class="muted">No verified ${g} units nearby right now. Try the Red Cross helpline or widen your search.</p>`}</div>`};
VIEWS.opinion=()=>{const l=S.opinions.filter(o=>o.sid===U.id);
 return `<h2>Second medical opinion</h2><div class="grid" style="margin-top:12px"><div class="card"><h3>Ask another doctor</h3><label for="od">Doctor</label><select id="od">${S.doctors.map(d=>`<option value="${d.id}">${esc(d.name)} (${esc(d.spec)})</option>`).join('')}</select><label for="of">Report to share (file name)</label><input id="of" type="file"><label for="oq">Your question</label><textarea id="oq" rows="3"></textarea><p class="muted">Shared reports are visible only to the doctor you choose.</p><button class="btn" onclick="askOp()">Send request</button></div></div><h3 style="margin:20px 0 8px">Your requests</h3><div class="list">${l.map(o=>`<div class="card"><div class="row sp"><b>${esc(D(o.did).name)}</b><span class="pill ${o.ans?'ok':'warn'}">${o.ans?'Answered':'Waiting'}</span></div><p class="muted" style="margin:4px 0">${esc(o.q)}${o.file?' · Report: '+esc(o.file):''}</p>${o.ans?`<p style="margin:6px 0 0"><b>Opinion:</b> ${esc(o.ans)}</p><button class="btn ghost sm" style="margin-top:8px" onclick="tmp.doc='${o.did}';go('book')">Book consultation</button>`:''}</div>`).join('')||'<p class="muted">None yet.</p>'}</div>`};
function askOp(){const q=val('oq');if(!q)return toast('Write your question.');const f=$('#of').files[0];S.opinions.push({id:id(),sid:U.id,did:val('od'),q,file:f?f.name:'',ans:''});log(D(val('od')).name,'Granted access to a shared report');rerender();toast('Request sent.')}
VIEWS.access=()=>{const l=S.accReq.filter(a=>a.sid===U.id);
 return `<h2>Accessibility assistance</h2><div class="grid" style="margin-top:12px"><div class="card"><h3>Wheelchair access at hospitals</h3>${vh().map(h=>`<div class="item"><span>${esc(h.name)}</span><span class="pill ${h.wheel?'ok':'bad'}">${h.wheel?'Accessible':'Not confirmed'}</span></div>`).join('')}</div><div class="card"><h3>Request assistance</h3><label for="ar">Type</label><select id="ar">${['Accessible transport','Wheelchair at medical centre','Escort to appointment','Ramp or lift access','Other'].map(x=>`<option>${x}</option>`).join('')}</select><label for="aw">When and where</label><input id="aw" placeholder="Tomorrow 10 AM, Block C"><button class="btn" style="margin-top:12px" onclick="reqAcc()">Send request</button></div></div><h3 style="margin:20px 0 8px">My requests</h3><div class="list">${l.map(a=>`<div class="item"><div><b>${esc(a.type)}</b><div class="muted">${esc(a.when)}</div></div><span class="pill ${a.done?'ok':'warn'}">${a.done?'Arranged':'Pending'}</span></div>`).join('')||'<p class="muted">None yet.</p>'}</div>`};
function reqAcc(){const w=val('aw');if(!w)return toast('Add when and where.');S.accReq.push({id:id(),sid:U.id,type:val('ar'),when:w,done:false});rerender();toast('Request sent to admin.')}
VIEWS.privacy=()=>{const s=me();
 return `<h2>Medical data privacy</h2><div class="grid" style="margin-top:12px"><div class="card"><h3>Who can see my history</h3>${S.doctors.map(d=>`<div class="item"><span>${esc(d.name)}</span><button class="chip ${s.permit[d.id]?'on':''}" onclick="me().permit['${d.id}']=!me().permit['${d.id}'];log('You','${esc(d.name)} access '+(me().permit['${d.id}']?'granted':'revoked'));rerender()">${s.permit[d.id]?'Allowed':'Not allowed'}</button></div>`).join('')}</div><div class="card"><h3>Protection in the full system</h3>${['Encrypted data storage','Role-based access control','Permission needed for doctors to open records','Every access is logged'].map(x=>`<div class="item">${x}</div>`).join('')}<p class="muted" style="margin-top:8px">This demo keeps data in your browser only. Encryption runs on the real server.</p></div></div><h3 style="margin:20px 0 8px">Record access history</h3><div class="tw card"><table><tr><th>When</th><th>Who</th><th>What</th></tr>${S.access.slice(0,25).map(a=>`<tr><td>${a.when}</td><td>${esc(a.who)}</td><td>${esc(a.what)}</td></tr>`).join('')}</table></div>`};
</script>
<script>
const dq=did=>S.appts.filter(a=>a.did===did&&a.date===today()&&a.status!=='cancelled').sort((a,b)=>a.token.localeCompare(b.token));
const pname=a=>a.sname||(stu(a.sid)?stu(a.sid).name:a.sid);
const canSee=(a,did)=>!stu(a.sid)||stu(a.sid).permit[did];
function callNext(did){if(S.appts.some(a=>a.did===did&&a.date===today()&&a.status==='consulting'))return toast('Finish the current consultation first.');const n=dq(did).find(a=>a.status==='waiting');if(!n)return toast('Queue is empty.');n.status='consulting';rerender()}
VIEWS.dhome=()=>{const q=dq(U.id);return `<h2>Today's queue</h2><div class="row" style="margin:10px 0"><button class="btn" onclick="callNext('${U.id}')">Call next patient</button><span class="muted">${q.filter(a=>a.status==='waiting').length} waiting · ${q.filter(a=>a.status==='done').length} seen</span></div><div class="list">${q.map(a=>`<div class="card"><div class="row sp"><div><b>${a.token} · ${esc(pname(a))}</b> ${a.fu?'<span class="pill night">Follow-up</span>':''}<div class="muted">${esc(a.reason)}</div></div>${apPill(a.status)}</div><div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="viewHist('${a.id}')">Medical history</button>${a.status==='consulting'?`<button class="btn sm" onclick="consult(${a.id})">Open consultation</button>`:''}</div></div>`).join('')||'<p class="muted">No patients today.</p>'}</div>`};
function viewHist(i){const a=S.appts.find(x=>x.id==i);if(!canSee(a,U.id))return modal(`<h3>Permission needed</h3><p>${esc(pname(a))} has not allowed access to their history. Ask the student to allow it from their privacy settings.</p><button class="btn" onclick="closeModal()">Close</button>`);
 log(D(U.id).name,'Viewed medical history (with permission)');save();const h=S.appts.filter(x=>x.sid===a.sid&&x.status==='done');modal(`<h3>${esc(pname(a))}: history</h3>${stu(a.sid)?`<p class="muted">Blood ${esc(stu(a.sid).blood)} · Allergy: ${esc(stu(a.sid).allergy)} · ${esc(stu(a.sid).cond)}</p>`:''}${h.map(x=>`<div class="item"><div><b>${x.date}</b><div class="muted">${esc(x.reason)}: ${esc(x.notes)}</div></div></div>`).join('')||'<p class="muted">No earlier visits.</p>'}<button class="btn" style="margin-top:12px" onclick="closeModal()">Close</button>`)}
function consult(i){modal(`<h3>Consultation</h3><label for="cn">Diagnosis and notes</label><textarea id="cn" rows="3"></textarea><label for="cm">Medicine</label><input id="cm" placeholder="Azithromycin 500 mg"><label for="ct">Times</label><input id="ct" value="09:00, 21:00"><label for="cd">Days</label><input id="cd" type="number" value="5"><label for="cx">Recommend test</label><select id="cx"><option value="">None</option>${['X-ray','Ultrasound','CT Scan','MRI','Blood test'].map(x=>`<option>${x}</option>`).join('')}</select><label for="cf">Follow-up in (days)</label><input id="cf" type="number" placeholder="Leave empty if none"><div class="row" style="margin-top:14px"><button class="btn" onclick="finish(${i})">Save and complete</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
function finish(i){const a=S.appts.find(x=>x.id===i);a.notes=val('cn');a.status='done';const mn=val('cm');
 if(mn){const rx={name:mn,times:val('ct').split(',').map(x=>x.trim()),days:+val('cd')||1};a.rx=[rx];if(stu(a.sid))S.meds.push({id:id(),...rx,taken:{}})}
 const t=val('cx');if(t){a.tests=[t];if(stu(a.sid)&&t!=='Blood test')S.refs.push({id:id(),test:t,doc:D(U.id).name,date:today(),booked:false})}
 const f=+val('cf');if(f>0){const d=addDays(f);S.appts.push({id:id(),sid:a.sid,sname:a.sname,did:a.did,date:d,reason:'Follow-up: '+a.reason,token:newToken(a.did,d),status:'waiting',fu:true,rx:[],notes:'',tests:[],remind:true})}
 closeModal();rerender();toast('Consultation saved. Prescription sent to the student.')}
VIEWS.davail=()=>{const d=D(U.id);return `<h2>Availability</h2><div class="card" style="max-width:480px;margin-top:12px"><div class="row sp"><b>${d.avail?'Taking appointments':'Not available'}</b><button class="btn ${d.avail?'ghost':''}" onclick="D('${U.id}').avail=!D('${U.id}').avail;rerender()">${d.avail?'Mark unavailable':'Mark available'}</button></div><label for="sl">Today's hours</label><input id="sl" value="${esc(d.slots)}"><button class="btn" style="margin-top:12px" onclick="D('${U.id}').slots=val('sl');rerender();toast('Saved.')">Save hours</button></div>`};
VIEWS.dpat=()=>`<h2>Patient records</h2><p class="muted">You can open a history only when the student has allowed it.</p><div class="list">${S.students.map(s=>`<div class="item"><div><b>${esc(s.name)}</b><div class="muted">${s.id}</div></div>${s.permit[U.id]?(S.appts.find(a=>a.sid===s.id)?`<button class="btn sm" onclick="viewHist('${S.appts.find(a=>a.sid===s.id).id}')">Open</button>`:'<span class="muted">No visits yet</span>'):'<span class="pill bad">No permission</span>'}</div>`).join('')}</div>`;
VIEWS.dop=()=>{const l=S.opinions.filter(o=>o.did===U.id);return `<h2>Second-opinion requests</h2><div class="list">${l.map(o=>`<div class="card"><div class="row sp"><b>${esc(stu(o.sid)?.name||o.sid)}</b><span class="pill ${o.ans?'ok':'warn'}">${o.ans?'Answered':'Waiting'}</span></div><p class="muted">${esc(o.q)}${o.file?' · Report: '+esc(o.file):''}</p>${o.ans?`<p>${esc(o.ans)}</p>`:`<textarea id="oa${o.id}" rows="2" placeholder="Your opinion"></textarea><button class="btn sm" style="margin-top:8px" onclick="S.opinions.find(x=>x.id===${o.id}).ans=val('oa${o.id}')||'Reviewed.';log(D('${U.id}').name,'Reviewed shared report');rerender()">Send opinion</button>`}</div>`).join('')||'<p class="muted">No requests.</p>'}</div>`};
/* hospital */
const HH=()=>H(U.id);
const num=(k,l)=>`<div><label for="n_${k}">${l}</label><input id="n_${k}" type="number" min="0" value="${HH()[k]}" onchange="HH().${k}=+this.value;save()"></div>`;
VIEWS.hhome=()=>{const h=HH();return `<h2>Facilities & beds</h2><div class="card" style="margin-top:12px"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${num('icu','ICU beds free')}${num('beds','General beds free')}${num('amb','Ambulances ready')}</div><div class="row" style="margin-top:12px"><button class="chip ${h.wheel?'on':''}" onclick="HH().wheel=!HH().wheel;rerender()">Wheelchair accessible</button></div></div><h3 style="margin:18px 0 8px">Facilities</h3><div class="tabs">${EQ.map(k=>`<button class="chip ${h.eq[k]==='ok'?'on':''}" onclick="HH().eq['${k}']=HH().eq['${k}']==='ok'?'no':'ok';rerender()">${k}</button>`).join('')}</div><p class="muted">Changes show to students right away.</p>`};
VIEWS.hdoc=()=>`<h2>Doctor duty</h2><p class="muted">Mark who is on duty now.</p><div class="list">${SPECS.map(s=>`<div class="item"><span>${s}</span><button class="chip ${HH().docs[s]?'on':''}" onclick="HH().docs['${s}']=!HH().docs['${s}'];rerender()">${HH().docs[s]?'On duty':'Not on duty'}</button></div>`).join('')}</div>`;
VIEWS.heq=()=>{const h=HH();return `<h2>Equipment & maintenance</h2><div class="list">${EQ.filter(k=>h.eq[k]==='ok').map(k=>`<div class="item"><span>${k}</span><button class="chip ${h.maint.includes(k)?'on':''}" onclick="togM('${k}')">${h.maint.includes(k)?'Under maintenance':'Working'}</button></div>`).join('')}</div>${h.maint.length?`<div class="card" style="margin-top:14px;background:var(--warn-2)"><b>Maintenance alert</b><p class="muted" style="margin:4px 0 0">${h.maint.join(', ')} hidden from emergency matching until marked working.</p></div>`:''}`};
function togM(k){const h=HH();h.maint=h.maint.includes(k)?h.maint.filter(x=>x!==k):[...h.maint,k];rerender()}
VIEWS.hinfo=()=>{const h=HH();return `<h2>Profile & verification</h2><div class="card" style="max-width:480px;margin-top:12px"><span class="pill ${h.verified?'ok':'warn'}">${h.verified?'Verified by admin':'Awaiting verification'}</span><label for="pa">Address</label><input id="pa" value="${esc(h.addr)}"><label for="pp">Phone</label><input id="pp" value="${esc(h.ph)}"><label for="ph">Hours</label><input id="ph" value="${esc(h.hrs)}"><label for="pe">Emergency department</label><input id="pe" value="${esc(h.er)}"><button class="btn" style="margin-top:12px" onclick="Object.assign(HH(),{addr:val('pa'),ph:val('pp'),hrs:val('ph'),er:val('pe')});rerender();toast('Saved.')">Save</button></div>`};
</script>
<script>
const open_=()=>S.sos.filter(x=>x.step<3).length+S.night.filter(x=>x.step<3).length;
VIEWS.ahome=()=>{const t=[['Students',S.students.length],['Doctors',S.doctors.filter(d=>d.active).length],['Appointments today',S.appts.filter(a=>a.date===today()&&a.status!=='cancelled').length],['Open emergencies',open_()],['Hospitals to verify',S.hospitals.filter(h=>!h.verified).length],['Access requests',S.accReq.filter(a=>!a.done).length]];
 return `<h2>Overview</h2><div class="grid" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${t.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="stat" style="${x[0]==='Open emergencies'&&x[1]?'color:var(--sos)':''}">${x[1]}</div></div>`).join('')}</div>${open_()?`<div class="card" style="margin-top:14px;background:var(--sos-2)"><b>${open_()} emergency request(s) need attention.</b> <button class="btn sos sm" onclick="go('aem')">Open</button></div>`:''}`};
VIEWS.astu=()=>`<h2>Student accounts</h2><div class="tw card" style="margin-top:12px"><table><tr><th>Roll no.</th><th>Name</th><th>Hostel</th><th>Blood</th><th>Status</th><th></th></tr>${S.students.map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.hostel)}</td><td>${s.blood}</td><td><span class="pill ${s.active?'ok':'bad'}">${s.active?'Active':'Suspended'}</span></td><td><button class="btn ghost sm" onclick="stu('${s.id}').active=!stu('${s.id}').active;rerender()">${s.active?'Suspend':'Activate'}</button></td></tr>`).join('')}</table></div><p class="muted">Students register themselves from the login page.</p>`;
VIEWS.adoc=()=>`<h2>Doctor accounts</h2><div class="list">${S.doctors.map(d=>`<div class="item"><div><b>${esc(d.name)}</b><div class="muted">${esc(d.spec)} · ${esc(d.email)}</div></div><div class="row"><span class="pill ${d.avail?'ok':'warn'}">${d.avail?'Available':'Away'}</span><button class="btn ghost sm" onclick="D('${d.id}').active=!D('${d.id}').active;rerender()">${d.active?'Deactivate':'Activate'}</button></div></div>`).join('')}</div><div class="card" style="margin-top:14px;max-width:480px"><h3>Add a doctor</h3><label for="an">Name</label><input id="an"><label for="as">Speciality</label><input id="as"><label for="ae">Email</label><input id="ae"><button class="btn" style="margin-top:12px" onclick="addDoc()">Add doctor</button></div>`;
function addDoc(){const n=val('an'),e=val('ae');if(!n||!e)return toast('Name and email are needed.');S.doctors.push({id:'d'+id(),name:n,spec:val('as')||'General',email:e,pw:'doctor123',avail:true,slots:'9:00 AM - 1:00 PM',active:true});rerender();toast('Doctor added. Temporary password: doctor123')}
VIEWS.aq=()=>`<h2>Appointments & queue</h2>${S.doctors.map(d=>{const q=dq(d.id);return `<div class="card" style="margin-top:12px"><div class="row sp"><h3>${esc(d.name)}</h3><div class="row"><span class="muted">${q.filter(a=>a.status==='waiting').length} waiting</span><button class="btn sm" onclick="callNext('${d.id}')">Call next</button></div></div>${q.map(a=>`<div class="item" style="margin-top:8px"><div><b>${a.token}</b> ${esc(pname(a))}<div class="muted">${esc(a.reason)}</div></div><div class="row">${apPill(a.status)}${a.status==='waiting'?`<button class="btn ghost sm" onclick="S.appts.find(x=>x.id===${a.id}).status='cancelled';rerender()">Cancel</button>`:''}</div></div>`).join('')||'<p class="muted">Empty queue.</p>'}</div>`}).join('')}`;
VIEWS.aem=()=>`<h2>Emergency requests</h2><h3 style="margin:14px 0 8px;color:var(--sos)">SOS</h3><div class="list">${S.sos.map(x=>`<div class="card"><div class="row sp"><div><b>${esc(stu(x.sid)?.name||x.sid)}</b> · ${x.when}<div class="muted">${esc(x.loc)} · ${esc(x.what)}</div></div><span class="pill ${x.step===3?'ok':'bad'}">${STEPS[x.step]}</span></div>${x.step<3?`<button class="btn sm" style="margin-top:8px" onclick="S.sos.find(s=>s.id===${x.id}).step++;rerender()">Advance: ${STEPS[x.step+1]}</button>`:''}</div>`).join('')||'<p class="muted">None.</p>'}</div>
 <h3 style="margin:20px 0 8px">NightCare</h3><div class="list">${S.night.map(x=>`<div class="card"><div class="row sp"><div><b>${esc(stu(x.sid)?.name||x.sid)}</b> · ${esc(x.type)}<div class="muted">${esc(x.loc)} · ${x.when}${x.parent?' · Parent notified':''}${x.transport?' · Transport needed':''}</div></div><span class="pill night">${NSTEP[x.step]}</span></div>${x.step<3?`<button class="btn sm" style="margin-top:8px" onclick="nightAdv(${x.id})">${x.step===2?'Close request':'Advance: '+NSTEP[x.step+1]}</button>`:''}</div>`).join('')||'<p class="muted">None.</p>'}</div>
 <h3 style="margin:20px 0 8px">Accessibility requests</h3><div class="list">${S.accReq.map(a=>`<div class="item"><div><b>${esc(a.type)}</b><div class="muted">${esc(stu(a.sid)?.name||a.sid)} · ${esc(a.when)}</div></div>${a.done?'<span class="pill ok">Arranged</span>':`<button class="btn sm" onclick="S.accReq.find(x=>x.id===${a.id}).done=true;rerender()">Mark arranged</button>`}</div>`).join('')||'<p class="muted">None.</p>'}</div>`;
function nightAdv(i){const x=S.night.find(n=>n.id===i);x.step++;if(x.step===3&&x.fu){const d=addDays(1);S.appts.push({id:id(),sid:x.sid,did:'d1',date:d,reason:'Morning follow-up after NightCare: '+x.type,token:newToken('d1',d),status:'waiting',fu:true,rx:[],notes:'',tests:[],remind:true});toast('Morning follow-up booked.')}rerender()}
VIEWS.ahos=()=>`<h2>Hospital partnerships</h2><div class="list">${S.hospitals.map(h=>`<div class="card"><div class="row sp"><div><h3>${esc(h.name)}</h3><div class="muted">${esc(h.addr)} · ${esc(h.email)}</div></div><span class="pill ${h.verified?'ok':'warn'}">${h.verified?'Verified':'Pending'}</span></div><div class="row" style="margin-top:8px">${h.verified?'':`<button class="btn sm" onclick="H('${h.id}').verified=true;rerender()">Verify</button>`}<button class="btn ghost sm" onclick="S.hospitals=S.hospitals.filter(x=>x.id!=='${h.id}');rerender()">Remove partner</button></div></div>`).join('')}</div>`;
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'-';
VIEWS.afb=()=>`<h2>Feedback & reports</h2><div class="card" style="margin:12px 0"><div class="muted">Average rating</div><div class="stat">${avg(S.feedback.map(f=>f.rating))} / 5</div></div><div class="list">${S.feedback.map(f=>`<div class="item"><div><b>${esc(D(f.doc).name)}</b> · ${'★'.repeat(f.rating)}<div class="muted">${esc(f.text)}</div></div></div>`).join('')}</div>`;
VIEWS.aan=()=>{const ap=S.appts.filter(a=>a.status!=='cancelled');const by=S.doctors.map(d=>({n:d.name.replace('Dr. ',''),c:ap.filter(a=>a.did===d.id).length}));const mx=Math.max(1,...by.map(b=>b.c));
 const cat={'Fever / infection':/fever|cold|cough|throat/i,'Pain / injury':/pain|knee|sprain|injur|head/i,'Skin':/skin|rash/i,'Mental health':/stress|anxi|panic|sleep/i};const dem=Object.entries(cat).map(([k,r])=>[k,ap.filter(a=>r.test(a.reason)).length]);
 return `<h2>Campus health analytics</h2><div class="grid" style="margin-top:12px"><div class="card"><h3>Doctor workload (appointments)</h3><div class="barv" style="margin:14px 0 26px">${by.map(b=>`<div style="height:${Math.max(4,b.c/mx*100)}%"><b style="position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:.8rem">${b.c}</b><span>${esc(b.n.split(' ')[0])}</span></div>`).join('')}</div></div><div class="card"><h3>Common service demands</h3>${dem.map(d=>`<div class="item"><span>${d[0]}</span><b>${d[1]}</b></div>`).join('')}</div><div class="card"><h3>Performance</h3><div class="item"><span>Appointments completed</span><b>${S.appts.filter(a=>a.status==='done').length}</b></div><div class="item"><span>Cancelled</span><b>${S.appts.filter(a=>a.status==='cancelled').length}</b></div><div class="item"><span>Student rating</span><b>${avg(S.feedback.map(f=>f.rating))}/5</b></div><div class="item"><span>Emergencies handled</span><b>${S.sos.length+S.night.length}</b></div></div></div>`};
render();
</script>
